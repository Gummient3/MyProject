<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя 💖</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: url('https://source.unsplash.com/1600x900/?flowers') no-repeat center center fixed;
            background-size: cover;
            color: #5a3d5c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        img {
            width: 150px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        button {
            background: #ff7597;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #e34b6e;
        }
    </style>
</head>
<body>
<div class="container">
    <img src="https://placekitten.com/300/200" alt="Милый котик">
    <h2>Привет! 🐱</h2>
    <p>Ты мне очень нравишься, и у меня есть для тебя маленькое путешествие. Готова?</p>
    <button onclick="nextPage()">Далее 💖</button>
</div>
<script>
    let page = 1;
    function nextPage() {
        const container = document.querySelector('.container');
        if (page === 1) {
            container.innerHTML = `
                <img src="https://placekitten.com/301/200" alt="Еще один котик">
                <h2>Ты особенная 💕</h2>
                <p>Мне с тобой всегда тепло и радостно, как будто котик мурчит рядом.</p>
                <button onclick="nextPage()">Дальше 🐾</button>
            `;
        } else if (page === 2) {
            container.innerHTML = `
                <img src="https://placekitten.com/302/200" alt="Очаровательный котик">
                <h2>Мои мысли о тебе...</h2>
                <p>Когда я думаю о тебе, у меня на лице появляется улыбка, а сердце наполняется радостью.</p>
                <button onclick="nextPage()">Продолжить 😻</button>
            `;
        } else if (page === 3) {
            container.innerHTML = `
                <img src="https://placekitten.com/303/200" alt="Романтический котик">
                <h2>Почему ты?</h2>
                <p>Ты - это сочетание доброты, ума и красоты, которое делает мир вокруг светлее.</p>
                <button onclick="nextPage()">Еще 💖</button>
            `;
        } else if (page === 4) {
            container.innerHTML = `
                <img src="https://placekitten.com/304/200" alt="Котик с сердечками">
                <h2>У меня вопрос...</h2>
                <p>Давай будем вместе? 💖</p>
                <button onclick="answer(true)">Да! 😻</button>
                <button onclick="answer(false)">Нууу... 🤔</button>
            `;
        }
        page++;
    }

    function answer(yes) {
        const container = document.querySelector('.container');
        if (yes) {
            container.innerHTML = `
                <img src="https://placekitten.com/305/200" alt="Счастливый котик">
                <h2>Ура! 💕</h2>
                <p>Я так счастлив! Жду нашу первую встречу как котик ждет вкусняшку 😻</p>
            `;
        } else {
            container.innerHTML = `
                <img src="https://placekitten.com/306/200" alt="Грустный котик">
                <h2>Эх...</h2>
                <p>Я всё равно буду тебя уважать и желать счастья 🐱💕</p>
            `;
        }
    }
</script>
</body>
</html>
